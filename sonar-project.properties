# ============================================
# SONARQUBE - MARKETCOL
# ============================================
# Proyecto: MarketCOL - Aplicación Móvil y Backend
# Tecnologías: React Native (Expo) + Laravel
# ============================================

# ============================================
# INFORMACIÓN DEL PROYECTO
# ============================================
sonar.projectKey=marketcol
sonar.projectName=MarketCOL
sonar.projectVersion=1.0.0

# ============================================
# ORIGEN DEL CÓDIGO
# ============================================

# Frontend (React Native / Expo)
sonar.sources=app_movil

# Backend (Laravel)
sonar.sources=backend/app,backend/config,backend/database,backend/routes

# Si quieres analizar ambas carpetas
# sonar.sources=app_movil,backend

# ============================================
# EXCLUSIONES (¡IMPORTANTE!)
# ============================================

# EXCLUIR reportes de cobertura y archivos generados
sonar.exclusions=**/coverage/**,**/*.html,**/node_modules/**,**/dist/**,**/build/**,**/.expo/**,**/ios/**,**/android/**

# EXCLUIR archivos del backend (Laravel)
sonar.exclusions=**/vendor/**,**/storage/**,**/bootstrap/cache/**,**/public/**,**/database/migrations/**,**/database/seeders/**

# EXCLUIR archivos de prueba
sonar.test.exclusions=**/*.test.js,**/*.spec.js,**/*.test.ts,**/*.spec.ts,**/tests/**,**/__tests__/**

# ============================================
# CONFIGURACIÓN DE COBERTURA
# ============================================

# Cobertura para JavaScript (React Native)
sonar.javascript.lcov.reportPaths=app_movil/coverage/lcov.info,coverage/lcov.info

# Cobertura para PHP (Laravel) - si usas PHPUnit
sonar.php.coverage.reportPaths=backend/coverage.xml,backend/coverage/*.xml

# ============================================
# CONFIGURACIÓN DE LENGUAJES
# ============================================

# Analizar JavaScript/TypeScript y PHP
sonar.language=js,ts,php

# ============================================
# CONFIGURACIÓN DE PRUEBAS
# ============================================

# Directorio de pruebas (si tienes)
sonar.tests=app_movil/__tests__,backend/tests

# ============================================
# OTRAS CONFIGURACIONES
# ============================================

# Ignorar archivos minificados
sonar.javascript.exclusions=**/*.min.js

# Ignorar archivos de configuración
sonar.exclusions=**/*.config.js,**/*.config.ts,**/.eslintrc.*,**/jest.config.*,**/webpack.config.*